<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Trigenys Group — Accueil v7 (fenêtre 1440×900, à faire défiler)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0;background:#FCFAFB}</style></helmet>
<div style="width:1440px;height:900px;background:#FCFAFB">
  <iframe id="v7" data-src="V7-Accueil.dc.html" title="Accueil v7 dans une fenêtre 1440×900 : faire défiler pour voir le parallax et le rail horizontal" style="width:1440px;height:900px;border:0;display:block"></iframe>
</div>
</x-dc>
<script>
(function(){
  var f=document.getElementById('v7'), name=f.getAttribute('data-src');
  var c=[name,'project/'+name,'./project/'+name,(location.pathname.replace(/\/[^\/]*$/,'/'))+'project/'+name];
  (function tryNext(i){
    if(i>=c.length){f.src=name;return}
    fetch(c[i],{method:'GET',cache:'no-store'}).then(function(r){
      return r.ok&&r.text().then(function(t){return /<x-dc>/.test(t)});
    }).then(function(ok){ok?f.src=c[i]:tryNext(i+1)}).catch(function(){tryNext(i+1)});
  })(0);
})();
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
