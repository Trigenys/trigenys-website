# Provisionnement du projet Cloudflare Pages par AppFactory (Trigenys/appfactory, POST /infrastructure/pages).
# Le dépôt s'authentifie par OIDC GitHub ; aucun identifiant Cloudflare n'existe ici. Le projet Pages est connecté
# au dépôt : Cloudflare construit la branche `production` (publication humaine par PR depuis `main`) et publie un
# aperçu `<branche>.trigenys-website.pages.dev` pour les autres branches. Contrat : .appfactory/pages.json.
name: AppFactory Infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".appfactory/pages.json"
      - ".github/workflows/appfactory-infrastructure.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: appfactory-infrastructure-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Jeton OIDC GitHub (audience appfactory-api)
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=appfactory-api")"
          token="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$token" ]]; then
            echo "::error::GitHub n'a pas renvoyé de jeton OIDC."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Provisionner Cloudflare Pages via AppFactory
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          APPFACTORY_URL: https://appfactory-api.lawrynnjennifer.workers.dev
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (.repository == "Trigenys/trigenys-website") and
            (.projectName == "trigenys-website") and
            (.productionBranch | type == "string" and length > 0) and
            (.buildCommand | type == "string" and length > 0) and
            (.outputDirectory | type == "string" and length > 0)
          ' .appfactory/pages.json >/dev/null

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @.appfactory/pages.json \
            "$APPFACTORY_URL/infrastructure/pages")"
          jq . "$response_file"
          if [[ "$http_code" != "200" ]]; then
            echo "::error::AppFactory a répondu HTTP $http_code."
            exit 1
          fi
          if [[ "$(jq -r '.status // empty' "$response_file")" != "PROVISIONED" ]]; then
            echo "::error::AppFactory n'a pas renvoyé PROVISIONED."
            exit 1
          fi
          {
            echo "## AppFactory Pages"
            echo
            jq -r '.infrastructure as $i |
              "- Projet : " + ($i.pages.project // "?"),
              "- URL Pages : " + ($i.pages.url // "en attente"),
              "- Déploiement : " + ($i.pages.deploymentId // "?") + " (réutilisé : " + (($i.pages.reusedDeployment // false) | tostring) + ")",
              "- Domaine custom : " + ($i.customDomain.name // "non configuré"),
              "- Cible DNS : " + ($i.dns.target // "n/a")' "$response_file"
          } >> "$GITHUB_STEP_SUMMARY"
