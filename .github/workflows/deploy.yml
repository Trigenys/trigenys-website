# Mise en ligne de site/dist sur Cloudflare Pages (upload direct, sans intégration Git côté Cloudflare).
# Déclenchement manuel uniquement : la décision de publier reste humaine (docs/decisions/adr-0001-hebergement.md).
# Préalables (une fois, par un admin) : secrets CLOUDFLARE_API_TOKEN (jeton scoppé « Cloudflare Pages : Edit » sur le
# compte) et CLOUDFLARE_ACCOUNT_ID ; variable facultative CF_PAGES_PROJECT (défaut : trigenys-website).
name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "preview (URL *.pages.dev de branche) ou production (branche de production du projet Pages)"
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build et contrats (mêmes gates que la CI)
        run: npm run build
      - name: Branche Pages visée
        id: branch
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then echo "name=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT";
          else echo "name=preview-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"; fi
      - name: Déploiement Cloudflare Pages
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=${{ vars.CF_PAGES_PROJECT || 'trigenys-website' }} --branch=${{ steps.branch.outputs.name }} --commit-dirty=true
