# Mise en ligne de site/dist sur Cloudflare Pages via la brique réutilisable AppFactory
# (EagleFox31/appfactory-project-automation, reusable-pages-deploy.yml ; docs/decisions/adr-0001-hebergement.md).
# Déclenchement manuel uniquement : la décision de publier reste humaine.
# - plan : build + contrats + validation de la sortie, sans aucun secret ;
# - preview : même chose puis upload sur l'alias de branche *.pages.dev ;
# - production : upload sur la branche de production du projet Pages.
# Préalables (une fois, par un admin) : projet Pages existant, secrets CLOUDFLARE_API_TOKEN (jeton scoppé
# « Cloudflare Pages : Edit ») et CLOUDFLARE_ACCOUNT_ID sur les environnements preview / production ;
# variable facultative CF_PAGES_PROJECT (défaut : trigenys-website).
# Épinglage : SHA fusionné de la brique (EagleFox31/appfactory-project-automation, PR #145 squashée sur main).
name: deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (sans secret), preview (alias *.pages.dev) ou production"
        type: choice
        options: [plan, preview, production]
        default: plan

permissions:
  contents: read

jobs:
  pages:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-pages-deploy.yml@d86c14fcb365aa7a5d0246908a27523a2b31ab00
    with:
      appfactory_ref: d86c14fcb365aa7a5d0246908a27523a2b31ab00
      mode: ${{ inputs.mode }}
      project_name: ${{ vars.CF_PAGES_PROJECT || 'trigenys-website' }}
      dist_dir: site/dist
      working_directory: site
      build_command: npm run build
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
