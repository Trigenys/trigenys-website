<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
@@HEAD@@
<link rel="icon" href="/assets/favicon.png">
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/ss4-r-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plex-var-latin.woff2" crossorigin>
<style>
@@CSS@@
/* Pages secondaires : le style de l'accueil (ci-dessus, repris tel quel au build) + ces quelques règles. */
.pg{padding-top:44px}
.pg .bc{font-size:14px;color:var(--mu);margin:0 0 30px}
.pg .bc a{color:var(--mu);text-decoration:underline;text-underline-offset:3px}
.pg .bc a:hover{color:var(--in)}
.pg .hd{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.pg h1{margin:16px 0 0;font-size:60px;line-height:1.03;font-weight:500;max-width:880px}
.pg .ld{margin:22px 0 0;font-size:20px;line-height:1.55;color:var(--mu);max-width:700px}
.pg .cta{display:flex;gap:14px;align-items:center;margin-top:34px;flex-wrap:wrap}
.pg .shot{position:static;margin:0;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -32px rgba(37,28,42,.4),0 0 0 1px var(--li)}
.pg .shot img{display:block;width:100%;height:auto}
.pg .shot figcaption{font-size:13px;color:var(--mu);padding:10px 16px}
.pg .bk{margin-top:96px}
.pg h2{display:block;place-items:initial;text-align:left;border:0;border-radius:0;padding:0;background:none;color:var(--in);margin:0 0 24px;font-size:38px;line-height:1.1;font-weight:500;max-width:820px}
.pg .gr{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.pg .cd{background:#fff;border:1px solid var(--li);border-radius:16px;padding:24px 26px}
.pg .cd h3{margin:0 0 8px;font-size:19px;font-weight:600}
.pg .cd p{margin:0;color:var(--mu);line-height:1.6}
.pg ol.st{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pg ol.st li{counter-increment:s;border-top:2px solid var(--bx);padding-top:14px;color:var(--mu);line-height:1.55}
.pg ol.st li::before{content:counter(s,decimal-leading-zero);display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--bx);margin-bottom:8px}
.pg ol.st b{display:block;color:var(--in);margin-bottom:4px}
.pg .kv{display:grid;grid-template-columns:240px 1fr;gap:14px 28px;margin:0}
.pg .kv dt{font-weight:600}
.pg .kv dd{margin:0;color:var(--mu);line-height:1.55}
.pg .kv a,.pg .tx a{color:var(--bx);text-decoration:underline;text-underline-offset:3px}
.pg details{border-top:1px solid var(--li);padding:18px 0;max-width:860px}
.pg details:last-child{border-bottom:1px solid var(--li)}
.pg summary{cursor:pointer;font-weight:600;font-size:18px}
.pg details p{margin:12px 0 0;color:var(--mu);line-height:1.65}
.pg .tx{max-width:780px}
.pg .tx p,.pg .tx li{color:var(--mu);line-height:1.7}
.pg .tg{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pg .nf{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--bx);letter-spacing:.1em}
@media (max-width:900px){
.pg{padding-top:28px}
.pg .hd{grid-template-columns:1fr;gap:32px}
.pg h1{font-size:40px}
.pg .ld{font-size:18px}
.pg .bk{margin-top:64px}
.pg h2{font-size:30px}
.pg .gr,.pg ol.st{grid-template-columns:1fr}
.pg .kv{grid-template-columns:1fr;gap:2px}
.pg .kv dd{margin-bottom:14px}
}
</style>
</head>
<body>
<div class="t">
@@HEADER@@
<main class="w pg">
@@BREADCRUMB@@
@@CONTENT@@
</main>
@@CONTACT@@
@@FOOTER@@
</div>
<script>
@@FX@@
document.addEventListener("DOMContentLoaded", v7init);</script>
</body>
</html>
